aid: opti
name: Opti
description: >-
  Opti is an AI-native identity and access management (IAM) platform for
  enterprises struggling with access sprawl across human, non-human, and agentic
  identities. Founded in 2024 by Barak Perelman, Mille Gandelsman, and Ido
  Trivizki, Opti deploys pre-trained, domain-specific large language models
  trained on curated identity data to interpret risk, recommend least-privilege
  access decisions, and orchestrate safe permissions. The platform spans Access
  Intelligence, Risk Mitigation, Lifecycle Management (joiner/mover/leaver), and
  Compliance, integrating with 250+ identity solutions, IdPs, IGAs, HRIS, and
  ITSM systems without rip-and-replace. Opti raised a $20M seed round led by YL
  Ventures, Mayfield Fund, and Hetz Ventures.
